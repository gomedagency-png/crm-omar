server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El CRM muestra nombres y teléfonos de pacientes: que no lo indexe nadie
    # ni quede embebido en otro sitio.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # text/html no se declara: nginx siempre lo comprime y repetirlo genera un
    # warning de "duplicate MIME type" al arrancar.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Webhook de n8n --------------------------------------------------
    # El navegador le pega a /webhook/... en ESTE dominio y nginx lo reenvía a
    # n8n del lado del servidor. Así nunca hay una petición cross-origin y no
    # hace falta ningún header Access-Control (que n8n hoy no manda).
    #
    # Si n8n corre dentro del mismo proyecto de Easypanel, conviene apuntar al
    # nombre interno del servicio en vez de salir a internet, por ejemplo:
    #     proxy_pass http://n8n:5678/webhook/;
    location /webhook/ {
        proxy_pass https://gomedic-prueba-gomedic-n8n.6afcq3.easypanel.host/webhook/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host gomedic-prueba-gomedic-n8n.6afcq3.easypanel.host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El flujo consulta Google Calendar: puede tardar más que un request normal.
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;

        # Los turnos cambian: nunca servir una respuesta guardada.
        # Se usa "expires" y no "add_header" a propósito — ver la nota de abajo.
        proxy_buffering off;
        expires -1;
    }

    # --- Estáticos -------------------------------------------------------
    # Nota: un "add_header" dentro de un location CANCELA todos los add_header
    # heredados del server. Por eso el control de caché se hace con "expires",
    # que no rompe la herencia y deja intactos los headers de seguridad.

    # El HTML no se cachea: cada visita ve la última versión desplegada.
    location = /index.html {
        expires -1;
    }

    # Los assets sí, porque se renombran cuando cambian.
    location /assets/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
